<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collage Studio Pro</title>
    
    <!-- Cropper.js -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. DESIGN SYSTEM & VARIABLES (LIGHT THEME)
           ========================================================================== */
        :root {
            --box-size: 60mm;
            --gap-size: 10mm; 
            --margin-top: 5mm;
            --margin-right: 5mm;
            --margin-bottom: 5mm;
            --margin-left: 5mm;
            
            /* Light Theme Colors */
            --bg-body: #f8fafc;
            --bg-sidebar: rgba(255, 255, 255, 0.85);
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --border-ui: #e2e8f0;
            --border-ui-hover: #cbd5e1;
            
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.15);
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            
            --font: 'Plus Jakarta Sans', sans-serif;
            --transition-fast: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.02);
            --shadow-pop: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.25);
            --shadow-paper: 0 20px 40px -10px rgba(0, 0, 0, 0.15);
        }

        /* ==========================================================================
           2. BASE & RESET
           ========================================================================== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font);
            background-color: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* ==========================================================================
           3. SIDEBAR NAVIGATION
           ========================================================================== */
        .sidebar {
            width: 330px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-ui);
            display: flex;
            flex-direction: column;
            z-index: 100;
            flex-shrink: 0;
            overflow-y: auto;
            backdrop-filter: blur(12px);
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-ui);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #a855f7, #6366f1, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge-pro {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 800;
            padding: 3px 7px;
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 99px;
        }

        .sidebar-content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--bg-card);
            padding: 16px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-ui);
            box-shadow: var(--shadow-sm);
            transition: var(--transition-fast);
        }

        .setting-group:hover {
            border-color: var(--border-ui-hover);
        }

        .setting-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .number-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 90px;
        }

        .number-input-wrapper input {
            width: 100%;
            padding: 7px 24px 7px 10px;
            background: var(--bg-input);
            border: 1px solid var(--border-ui);
            border-radius: var(--radius-sm);
            font-family: var(--font);
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
            transition: var(--transition-fast);
            text-align: right;
            font-weight: 500;
        }

        .number-input-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
            background: #ffffff;
        }

        .number-input-wrapper .unit {
            position: absolute;
            right: 8px;
            font-size: 10px;
            color: var(--text-muted);
            pointer-events: none;
            font-weight: 600;
        }

        .margin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .margin-grid .number-input-wrapper { width: 100%; }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #e2e8f0;
            border-radius: 99px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -5px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.1s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        /* ==========================================================================
           4. MAIN VIEWPORT & WORKSPACE
           ========================================================================== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at 50% 20%, #f8fafc 0%, #e2e8f0 100%);
        }

        .top-bar {
            height: 64px;
            background: rgba(255, 255, 255, 0.85);
            border-bottom: 1px solid var(--border-ui);
            backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            z-index: 90;
        }

        .history-controls, .action-controls { display: flex; align-items: center; gap: 10px; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            cursor: pointer;
            transition: var(--transition-fast);
            font-family: var(--font);
            outline: none;
        }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.2);
        }
        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #ffffff;
            color: var(--text-primary);
            border: 1px solid var(--border-ui);
            box-shadow: var(--shadow-sm);
        }
        .btn-secondary:hover:not(:disabled) {
            background: #f8fafc;
            border-color: var(--border-ui-hover);
        }

        .btn-danger {
            background: #ffffff;
            color: var(--danger);
            border: 1px solid #fecaca;
        }
        .btn-danger:hover:not(:disabled) {
            background: #fef2f2;
            border-color: var(--danger);
        }

        .btn-icon {
            padding: 8px;
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-fast);
        }
        .btn-icon:hover:not(:disabled) {
            color: var(--text-primary);
            background: #f1f5f9;
        }

        .workspace-wrapper {
            flex: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 50px 20px;
        }

        /* ==========================================================================
           5. A4 PAPER & GRID (WITH SKELETON RIPPLES & PULSING)
           ========================================================================== */
        .a4-paper {
            width: 210mm;
            height: 297mm;
            background-color: #ffffff;
            box-shadow: var(--shadow-paper);
            border-radius: 4px;
            padding: var(--margin-top) var(--margin-right) var(--margin-bottom) var(--margin-left);
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(3, var(--box-size));
            grid-template-rows: repeat(4, var(--box-size));
            gap: var(--gap-size);
            align-content: start;
            transition: padding 0.3s cubic-bezier(0.16, 1, 0.3, 1), gap 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .photo-cell {
            width: var(--box-size);
            height: var(--box-size);
            background-color: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: var(--radius-sm);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            box-sizing: border-box;
            transition: var(--transition-fast);
            gap: 6px;
            overflow: hidden;
        }

        /* RIPPLE EFFECT FOR SKELETON TARGETS */
        @keyframes rippleHover {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }
        
        .photo-cell::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50%;
            height: 50%;
            background: rgba(99, 102, 241, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            pointer-events: none;
        }

        .photo-cell:hover {
            border-color: var(--primary);
            background-color: #eff6ff;
        }
        
        .photo-cell:not(.is-filled):hover::after {
            animation: rippleHover 0.6s ease-out;
        }

        .photo-cell svg.add-icon {
            width: 24px;
            height: 24px;
            color: #94a3b8;
            transition: var(--transition-fast);
            z-index: 2;
        }
        .photo-cell:hover svg.add-icon {
            color: var(--primary);
            transform: scale(1.15);
        }
        .photo-cell .add-text {
            color: #94a3b8;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.2px;
            z-index: 2;
        }

        .photo-cell.is-filled {
            border: none;
            background: transparent;
            cursor: grab;
        }
        .photo-cell.is-filled:active { cursor: grabbing; }

        /* PULSING DROP TARGET WHEN DRAGGING */
        @keyframes borderPulse {
            0% { border-color: var(--primary); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
            50% { border-color: #818cf8; box-shadow: 0 0 0 8px rgba(99, 102, 241, 0); }
            100% { border-color: var(--primary); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }

        .photo-cell.drag-active {
            border: 3px dashed var(--primary);
            background-color: rgba(99, 102, 241, 0.05);
            transform: scale(0.96);
            animation: borderPulse 1.2s infinite;
            opacity: 0.9;
        }

        .photo-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            pointer-events: none;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
            transition: border-radius 0.2s ease;
        }

        .photo-cell.is-filled svg,
        .photo-cell.is-filled .add-text {
            display: none;
        }

        /* ==========================================================================
           6. CONTEXT DROPDOWN MENU
           ========================================================================== */
        #contextMenu {
            display: none;
            position: absolute;
            background: #ffffff;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-pop);
            border: 1px solid var(--border-ui);
            width: 210px;
            z-index: 1000;
            flex-direction: column;
            opacity: 0;
            transform: translateY(-8px) scale(0.95);
            transition: opacity 0.15s ease, transform 0.15s ease;
            overflow: hidden;
            padding: 6px;
        }

        #contextMenu.show {
            display: flex;
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .menu-item {
            padding: 10px 14px;
            background: none;
            border: none;
            border-radius: var(--radius-sm);
            text-align: left;
            font-size: 13px;
            font-family: var(--font);
            font-weight: 600;
            cursor: pointer;
            color: var(--text-primary);
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .menu-item svg { width: 16px; height: 16px; color: var(--text-muted); }

        .menu-item:hover {
            background-color: #f1f5f9;
            color: var(--primary);
        }
        .menu-item:hover svg { color: var(--primary); }

        .menu-item.text-danger {
            color: var(--danger);
            border-top: 1px solid var(--border-ui);
            margin-top: 4px;
        }
        .menu-item.text-danger svg { color: var(--danger); }
        .menu-item.text-danger:hover {
            background-color: #fef2f2;
            color: var(--danger-hover);
        }

        .submenu-panel {
            padding: 12px;
            background: #f8fafc;
            border: 1px solid var(--border-ui);
            border-radius: var(--radius-sm);
            margin: 4px 0;
            display: none;
            flex-direction: column;
            gap: 8px;
        }
        .submenu-panel.open { display: flex; }
        .slider-label-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        /* ==========================================================================
           7. MODALS (Crop & Live Editor)
           ========================================================================== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.open { display: flex; opacity: 1; }

        .modal-content {
            background: #ffffff;
            border: 1px solid var(--border-ui);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-paper);
            width: 90%;
            max-width: 650px;
            overflow: hidden;
            transform: scale(0.94);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-overlay.open .modal-content { transform: scale(1); }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-ui);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 { font-size: 17px; font-weight: 700; color: var(--text-primary); }

        .modal-body { padding: 24px; max-height: 65vh; overflow-y: auto; }
        .modal-footer {
            padding: 16px 24px;
            background: #f8fafc;
            border-top: 1px solid var(--border-ui);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .cropper-wrapper {
            width: 100%;
            height: 400px;
            background: #e2e8f0;
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        /* Live Editor Styling */
        .edit-layout { display: flex; flex-direction: column; gap: 20px; }
        .edit-preview-box {
            width: 100%;
            height: 340px;
            background: #f1f5f9;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--border-ui);
        }
        .edit-preview-box canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
        .edit-controls { display: flex; flex-direction: column; gap: 14px; }

        /* ==========================================================================
           8. TOAST SYSTEM
           ========================================================================== */
        #toastContainer {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 3000;
            pointer-events: none;
        }
        .toast {
            background: #ffffff;
            border: 1px solid var(--border-ui);
            box-shadow: var(--shadow-pop);
            padding: 14px 18px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 280px;
            transform: translateX(120%);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: auto;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        .toast-icon { width: 20px; height: 20px; flex-shrink: 0; }
        .toast.success .toast-icon { color: var(--success); }
        .toast.error .toast-icon { color: var(--danger); }
        .toast-message { font-size: 13px; font-weight: 600; color: var(--text-primary); }

        .hidden-input { display: none; }

        @media print {
            .sidebar, .top-bar, #contextMenu, .modal-overlay, #toastContainer { display: none !important; }
            body { background: white; }
            .workspace-wrapper { padding: 0; background: none; justify-content: flex-start; align-items: flex-start; }
            .a4-paper { box-shadow: none; margin: 0; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand-logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
                <span>Collage Studio</span>
            </div>
            <span class="badge-pro">PRO</span>
        </div>

        <div class="sidebar-content">
            <div class="setting-group">
                <div class="setting-title">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Batch Operations
                </div>
                <button class="btn btn-secondary" id="btnBulkUpload" style="width: 100%;">Auto-Fill 12 Photos</button>
                <button class="btn btn-danger" id="btnClearAll" style="width: 100%;">Clear Canvas</button>
            </div>

            <div class="setting-group">
                <div class="setting-title">Grid Configuration</div>
                
                <div class="input-row">
                    <span class="input-label">Image Size</span>
                    <div class="number-input-wrapper">
                        <input type="number" id="inpSize" value="60" min="10" max="100">
                        <span class="unit">mm</span>
                    </div>
                </div>

                <div class="input-row">
                    <span class="input-label">Image Gap</span>
                    <div class="number-input-wrapper">
                        <input type="number" id="inpGap" value="10" min="0" max="50">
                        <span class="unit">mm</span>
                    </div>
                </div>
                
                <div class="input-row" style="margin-top: 4px;">
                    <span class="input-label" style="font-weight: 700; color: var(--primary);">Global Radius</span>
                    <div class="number-input-wrapper">
                        <input type="number" id="inpGlobalRadius" value="0" min="0" max="100">
                        <span class="unit">px</span>
                    </div>
                </div>
            </div>

            <div class="setting-group">
                <div class="setting-title">Page Margins</div>
                <div class="margin-grid">
                    <div class="number-input-wrapper">
                        <input type="number" id="inpMarginTop" value="5" min="0" title="Top Margin"><span class="unit">Top</span>
                    </div>
                    <div class="number-input-wrapper">
                        <input type="number" id="inpMarginBottom" value="5" min="0" title="Bottom Margin"><span class="unit">Bot</span>
                    </div>
                    <div class="number-input-wrapper">
                        <input type="number" id="inpMarginLeft" value="5" min="0" title="Left Margin"><span class="unit">Left</span>
                    </div>
                    <div class="number-input-wrapper">
                        <input type="number" id="inpMarginRight" value="5" min="0" title="Right Margin"><span class="unit">Right</span>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <header class="top-bar">
            <div class="history-controls">
                <button class="btn-icon" id="btnUndo" title="Undo (Ctrl+Z)" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
                <button class="btn-icon" id="btnRedo" title="Redo (Ctrl+Y)" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
                <div style="width: 1px; height: 20px; background: var(--border-ui); margin: 0 4px;"></div>
                <button class="btn-icon" id="btnSave" title="Save Layout Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></button>
                <button class="btn-icon" id="btnLoad" title="Load Layout Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>

        </header>

        <div class="workspace-wrapper" id="workspaceContainer">

    </main>

        </button>
        <button class="menu-item" id="btnMenuEdit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Edit (Brightness & Sharp)
        </button>
        <button class="menu-item" id="btnMenuCorner">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>

        <div class="submenu-panel" id="submenuCorner">

                            <div class="slider-label-row"><span>Sharpening</span><span id="lblSharpen">0%</span></div>

    <!-- TOAST NOTIFICATIONS -->
    <div id="toastContainer"></div>

    <input type="file" id="inpSingleFile" class="hidden-input" accept="image/*">
    <input type="file" id="inpBulkFile" class="hidden-input" accept="image/*" multiple>

    <script>
        // ---------------------------------------------------------------------
        // TOAST MANAGER
        // ---------------------------------------------------------------------
        class ToastManager {
            constructor(containerId) { this.container = document.getElementById(containerId); }
            show(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const iconSvg = type === 'success' 
                    ? `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`
                    : `<svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;
                toast.innerHTML = `${iconSvg}<span class="toast-message">${message}</span>`;
                this.container.appendChild(toast);
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
            }
        }

        // ---------------------------------------------------------------------
        // STATE MANAGER (Undo / Redo)
        // ---------------------------------------------------------------------
        class StateManager {
            constructor(initialState, onStateChange) {
                this.history = []; this.currentIndex = -1; this.onStateChange = onStateChange;
                this.push(initialState, true);
            }
            get current() { return JSON.parse(JSON.stringify(this.history[this.currentIndex])); }
            push(newState, isInitial = false) {
                if (this.currentIndex < this.history.length - 1) this.history = this.history.slice(0, this.currentIndex + 1);
                this.history.push(JSON.parse(JSON.stringify(newState)));
                this.currentIndex++;
                if (!isInitial) this.onStateChange(this.current);
            }
            undo() { if (this.currentIndex > 0) { this.currentIndex--; this.onStateChange(this.current); return true; } return false; }
            redo() { if (this.currentIndex < this.history.length - 1) { this.currentIndex++; this.onStateChange(this.current); return true; } return false; }
            canUndo() { return this.currentIndex > 0; }
            canRedo() { return this.currentIndex < this.history.length - 1; }
        }

        // ---------------------------------------------------------------------
        // MAIN APPLICATION ENGINE
        // ---------------------------------------------------------------------
        const App = {
            paper: document.getElementById('paperGrid'),
            menu: document.getElementById('contextMenu'),
            toast: new ToastManager('toastContainer'),
            cropper: null,
            activeCellIndex: null,
            draggedCellIndex: null,
            tempOriginalBase64: null, 
            editImageObj: null,

            init() {
                // ADDED: cropData to remember the exact crop position
                const initialState = {
                    settings: { size: 60, gap: 10, globalRadius: 0, marginTop: 5, marginBottom: 5, marginLeft: 5, marginRight: 5 },
                    images: Array(12).fill(null).map(() => ({ 
                        originalBase64: null, 
                        croppedBase64: null, 
                        editedBase64: null, 
                        brightness: 100, 
                        sharpen: 0, 
                        radius: 0,
                        cropData: null 
                    }))
                };

                this.stateMgr = new StateManager(initialState, (state) => this.render(state));
                this.setupEventListeners();
                this.render(this.stateMgr.current);
                
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey && e.key === 'z') { e.preventDefault(); this.handleUndo(); }
                    if (e.ctrlKey && e.key === 'y') { e.preventDefault(); this.handleRedo(); }
                    if (e.key === 'Escape') { this.closeCropModal(); this.closeEditModal(); this.closeMenu(); }
                });
            },

            // --- RENDER WORKSPACE ---
            render(state) {
                const root = document.documentElement.style;
                root.setProperty('--box-size', `${state.settings.size}mm`);
                root.setProperty('--gap-size', `${state.settings.gap}mm`);
                root.setProperty('--margin-top', `${state.settings.marginTop}mm`);
                root.setProperty('--margin-bottom', `${state.settings.marginBottom}mm`);
                root.setProperty('--margin-left', `${state.settings.marginLeft}mm`);
                root.setProperty('--margin-right', `${state.settings.marginRight}mm`);

                document.getElementById('inpSize').value = state.settings.size;
                document.getElementById('inpGap').value = state.settings.gap;
                document.getElementById('inpGlobalRadius').value = state.settings.globalRadius;

                document.getElementById('btnUndo').disabled = !this.stateMgr.canUndo();
                document.getElementById('btnRedo').disabled = !this.stateMgr.canRedo();

                this.paper.innerHTML = '';
                
                state.images.forEach((imgData, index) => {
                    const cell = document.createElement('div');
                    const displayBase64 = imgData.editedBase64 || imgData.croppedBase64;
                    const hasImg = displayBase64 !== null;
                    
                    cell.className = `photo-cell ${hasImg ? 'is-filled' : ''}`;
                    cell.dataset.index = index;

                    if (hasImg) {
                        cell.draggable = true;
                        const img = document.createElement('img');
                        img.src = displayBase64;
                        img.style.borderRadius = `${imgData.radius}px`;
                        cell.appendChild(img);
                        
                        cell.addEventListener('dragstart', (e) => this.handleDragStart(e, index));
                        cell.addEventListener('dragover', (e) => this.handleDragOver(e, cell));
                        cell.addEventListener('dragleave', (e) => this.handleDragLeave(e, cell));
                        cell.addEventListener('drop', (e) => this.handleDrop(e, index, cell));
                        cell.addEventListener('dragend', () => cell.classList.remove('drag-active'));
                    } else {
                        cell.innerHTML = `<svg class="add-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span class="add-text">Add Photo</span>`;
                        cell.addEventListener('dragover', (e) => this.handleDragOver(e, cell));
                        cell.addEventListener('dragleave', (e) => this.handleDragLeave(e, cell));
                        cell.addEventListener('drop', (e) => this.handleDrop(e, index, cell));
                    }

                    cell.addEventListener('click', (e) => this.handleCellClick(e, index, cell, hasImg));
                    this.paper.appendChild(cell);
                });
            },

            // --- EVENT LISTENERS ---
            setupEventListeners() {
                ['Size', 'Gap', 'MarginTop', 'MarginBottom', 'MarginLeft', 'MarginRight'].forEach(s => {
                    document.getElementById(`inp${s}`)?.addEventListener('change', (e) => {
                        const newState = this.stateMgr.current;
                        const key = s.charAt(0).toLowerCase() + s.slice(1);
                        newState.settings[key] = Math.max(0, parseFloat(e.target.value) || 0);
                        this.stateMgr.push(newState);
                    });
                });

                document.getElementById('inpGlobalRadius').addEventListener('change', (e) => {
                    let rad = parseInt(e.target.value) || 0;
                    if (rad < 0) rad = 0; if (rad > 100) rad = 100;
                    const newState = this.stateMgr.current;
                    newState.settings.globalRadius = rad;
                    newState.images.forEach(img => { if(img.croppedBase64) img.radius = rad; });
                    this.stateMgr.push(newState);
                });

                document.getElementById('btnUndo').addEventListener('click', () => this.handleUndo());
                document.getElementById('btnRedo').addEventListener('click', () => this.handleRedo());
                document.getElementById('btnSave').addEventListener('click', () => this.saveSettingsToLocal());
                document.getElementById('btnLoad').addEventListener('click', () => this.loadSettingsFromLocal());
                
                document.getElementById('btnClearAll').addEventListener('click', () => {
                    if (confirm("Are you sure you want to clear all canvas photos?")) {
                        const newState = this.stateMgr.current;
                        newState.images = Array(12).fill(null).map(() => ({ 
                            originalBase64: null, croppedBase64: null, editedBase64: null, brightness: 100, sharpen: 0, radius: 0, cropData: null 
                        }));
                        this.stateMgr.push(newState);
                        this.toast.show("Canvas cleared.");
                        this.closeMenu();
                    }
                });

                // Standard Print
                document.getElementById('btnPrint').addEventListener('click', () => window.print());
                document.getElementById('btnExportPDF').addEventListener('click', () => this.generatePDF());

                // Bulk and Single Upload
                document.getElementById('btnBulkUpload').addEventListener('click', () => document.getElementById('inpBulkFile').click());
                document.getElementById('inpSingleFile').addEventListener('change', (e) => this.handleSingleFile(e));
                document.getElementById('inpBulkFile').addEventListener('change', (e) => this.handleBulkFile(e));

                // Context Menu Clicks
                document.addEventListener('click', (e) => { 
                    if (!this.menu.contains(e.target) && !e.target.closest('.photo-cell')) this.closeMenu(); 
                });
                
                document.getElementById('btnMenuCrop').addEventListener('click', () => this.openCropperForActiveImage());
                document.getElementById('btnMenuEdit').addEventListener('click', () => this.openEditModalForActiveImage());
                document.getElementById('btnMenuCorner').addEventListener('click', () => {
                    document.getElementById('submenuCorner').classList.toggle('open');
                });
                document.getElementById('btnMenuDelete').addEventListener('click', () => this.deleteActiveImage());

                // Corner slider
                document.getElementById('sldRadius').addEventListener('input', (e) => this.handleRadiusPreview(e.target.value));
                document.getElementById('sldRadius').addEventListener('change', (e) => this.handleRadiusCommit(e.target.value));

                // Modal Actions
                document.getElementById('btnApplyCrop').addEventListener('click', () => this.applyCrop());
                document.getElementById('btnApplyEdit').addEventListener('click', () => this.applyEdit());
                
                // Edit Sliders
                document.getElementById('sldBrightness').addEventListener('input', (e) => {
                    document.getElementById('lblBrightness').innerText = `${e.target.value}%`;
                    this.renderEditPreview(false);
                });
                document.getElementById('sldSharpen').addEventListener('input', (e) => {
                    document.getElementById('lblSharpen').innerText = `${e.target.value}%`;
                    this.renderEditPreview(false);
                });
            },

            // --- DRAG & DROP SWAPPING ---
            handleDragStart(e, index) {
                this.draggedCellIndex = index; this.closeMenu();
                e.dataTransfer.setData('text/plain', index); e.dataTransfer.effectAllowed = 'move';
            },
            handleDragOver(e, cell) { 
                e.preventDefault(); 
                e.dataTransfer.dropEffect = 'move'; 
                cell.classList.add('drag-active'); 
            },
            handleDragLeave(e, cell) { 
                cell.classList.remove('drag-active'); 
            },
            handleDrop(e, targetIndex, cell) {
                e.preventDefault(); 
                cell.classList.remove('drag-active');
                if (this.draggedCellIndex !== null && this.draggedCellIndex !== targetIndex) {
                    const newState = this.stateMgr.current;
                    const temp = newState.images[targetIndex];
                    newState.images[targetIndex] = newState.images[this.draggedCellIndex];
                    newState.images[this.draggedCellIndex] = temp;
                    this.stateMgr.push(newState);
                }
                this.draggedCellIndex = null;
            },

            // --- CELL CLICK & DROPDOWN MENU ---
            handleCellClick(e, index, cell, hasImg) {
                this.activeCellIndex = index;
                if (!hasImg) {
                    this.closeMenu();
                    document.getElementById('inpSingleFile').click();
                } else {
                    this.openMenu(e, index, cell);
                }
            },
            openMenu(e, index, cell) {
                document.getElementById('submenuCorner').classList.remove('open');
                
                const rect = cell.getBoundingClientRect();
                let top = rect.bottom + window.scrollY + 6;
                let left = rect.left + window.scrollX;
                if (top + 250 > window.innerHeight + window.scrollY) top = rect.top + window.scrollY - 240;

                this.menu.style.top = `${top}px`;
                this.menu.style.left = `${left}px`;
                this.menu.classList.add('show');

                const rad = this.stateMgr.current.images[index].radius;
                document.getElementById('sldRadius').value = rad;
                document.getElementById('lblRadius').innerText = `${rad}px`;
            },
            closeMenu() { this.menu.classList.remove('show'); },
            
            handleRadiusPreview(val) {
                document.getElementById('lblRadius').innerText = `${val}px`;
                if (this.activeCellIndex !== null) {
                    const img = this.paper.children[this.activeCellIndex].querySelector('img');
                    if (img) img.style.borderRadius = `${val}px`;
                }
            },
            handleRadiusCommit(val) {
                if (this.activeCellIndex !== null) {
                    const newState = this.stateMgr.current;
                    newState.images[this.activeCellIndex].radius = parseInt(val);
                    this.stateMgr.push(newState);
                }
            },
            deleteActiveImage() {
                const newState = this.stateMgr.current;
                newState.images[this.activeCellIndex] = { 
                    originalBase64: null, croppedBase64: null, editedBase64: null, brightness: 100, sharpen: 0, radius: 0, cropData: null 
                };
                this.stateMgr.push(newState);
                this.closeMenu();
            },

            // --- CROPPER ENGINE WITH MEMORY ---
            handleSingleFile(e) {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    this.tempOriginalBase64 = event.target.result;
                    this.initCropperModal(this.tempOriginalBase64, null); // null because it's a brand new upload
                };
                reader.readAsDataURL(file);
                e.target.value = ''; 
            },
            openCropperForActiveImage() {
                this.closeMenu();
                const imgData = this.stateMgr.current.images[this.activeCellIndex];
                if (imgData && imgData.originalBase64) {
                    this.tempOriginalBase64 = imgData.originalBase64;
                    // Pass the saved crop data into the cropper
                    this.initCropperModal(this.tempOriginalBase64, imgData.cropData);
                }
            },
            initCropperModal(base64Src, existingCropData = null) {
                const imgNode = document.getElementById('imageToCrop');
                imgNode.src = base64Src;
                document.getElementById('cropModalOverlay').classList.add('open');
                
                if (this.cropper) this.cropper.destroy();
                
                this.cropper = new Cropper(imgNode, { 
                    aspectRatio: 1, 
                    viewMode: 1, 
                    dragMode: 'move', 
                    // Only auto-center if we don't have previous crop data
                    autoCropArea: existingCropData ? undefined : 0.9, 
                    guides: true,
                    ready: () => {
                        // Once loaded, set the previous coordinates if they exist
                        if (existingCropData) {
                            this.cropper.setData(existingCropData);
                        }
                    }
                });
            },
            applyCrop() {
                if (!this.cropper || this.activeCellIndex === null) return;
                
                // Get image output
                const canvas = this.cropper.getCroppedCanvas({ width: 800, height: 800 });
                const cropped = canvas.toDataURL('image/jpeg', 0.92);
                
                // ADDED: Capture the physical crop coordinates so we can restore them later
                const cropData = this.cropper.getData();
                
                const newState = this.stateMgr.current;
                newState.images[this.activeCellIndex] = {
                    originalBase64: this.tempOriginalBase64,
                    croppedBase64: cropped,
                    editedBase64: null, // Wipe old edits so they don't apply weirdly to new crop
                    brightness: 100,
                    sharpen: 0,
                    radius: newState.settings.globalRadius,
                    cropData: cropData // Save coordinates to state
                };
                
                this.stateMgr.push(newState);
                this.closeCropModal();
                this.toast.show("Image cropped successfully!");
            },
            closeCropModal() {
                document.getElementById('cropModalOverlay').classList.remove('open');
                if (this.cropper) { this.cropper.destroy(); this.cropper = null; }
                this.tempOriginalBase64 = null;
            },

            // --- LIVE ENHANCER (Brightness & Sharpen) ---
            openEditModalForActiveImage() {
                this.closeMenu();
                const imgData = this.stateMgr.current.images[this.activeCellIndex];
                if (!imgData || !imgData.croppedBase64) return;

                document.getElementById('sldBrightness').value = imgData.brightness || 100;
                document.getElementById('lblBrightness').innerText = `${imgData.brightness || 100}%`;
                document.getElementById('sldSharpen').value = imgData.sharpen || 0;
                document.getElementById('lblSharpen').innerText = `${imgData.sharpen || 0}%`;

                this.editImageObj = new Image();
                this.editImageObj.onload = () => {
                    this.renderEditPreview(false);
                    document.getElementById('editModalOverlay').classList.add('open');
                };
                this.editImageObj.src = imgData.croppedBase64;
            },

            renderEditPreview(isExport = false) {
                if (!this.editImageObj) return;

                const canvas = isExport ? document.createElement('canvas') : document.getElementById('editPreviewCanvas');
                const ctx = canvas.getContext('2d', { willReadFrequently: true });

                const scale = isExport ? 1 : Math.min(1, 400 / this.editImageObj.width);
                canvas.width = this.editImageObj.width * scale;
                canvas.height = this.editImageObj.height * scale;

                const brightness = document.getElementById('sldBrightness').value;
                const sharpen = document.getElementById('sldSharpen').value;

                // Brightness adjustment
                ctx.filter = `brightness(${brightness}%)`;
                ctx.drawImage(this.editImageObj, 0, 0, canvas.width, canvas.height);
                ctx.filter = 'none';

                // Sharpening Kernel Convolution
                if (sharpen > 0) {
                    const amt = sharpen / 100;
                    const weights = [
                        0, -amt, 0,
                        -amt, 1 + 4 * amt, -amt,
                        0, -amt, 0
                    ];
                    
                    const w = canvas.width;
                    const h = canvas.height;
                    const src = ctx.getImageData(0, 0, w, h);
                    const output = ctx.createImageData(w, h);
                    const sData = src.data;
                    const oData = output.data;

                    for (let y = 1; y < h - 1; y++) {
                        for (let x = 1; x < w - 1; x++) {
                            const dstOff = (y * w + x) * 4;
                            let r = 0, g = 0, b = 0;

                            for (let cy = -1; cy <= 1; cy++) {
                                for (let cx = -1; cx <= 1; cx++) {
                                    const srcOff = ((y + cy) * w + (x + cx)) * 4;
                                    const wt = weights[(cy + 1) * 3 + (cx + 1)];
                                    r += sData[srcOff] * wt;
                                    g += sData[srcOff + 1] * wt;
                                    b += sData[srcOff + 2] * wt;
                                }
                            }
                            oData[dstOff] = r;
                            oData[dstOff + 1] = g;
                            oData[dstOff + 2] = b;
                            oData[dstOff + 3] = sData[dstOff + 3];
                        }
                    }
                    
                    // Retain edge boundaries
                    for (let x = 0; x < w; x++) {
                        for (let y of [0, h - 1]) {
                            const i = (y * w + x) * 4;
                            oData[i] = sData[i]; oData[i+1] = sData[i+1]; oData[i+2] = sData[i+2]; oData[i+3] = sData[i+3];
                        }
                    }
                    for (let y = 0; y < h; y++) {
                        for (let x of [0, w - 1]) {
                            const i = (y * w + x) * 4;
                            oData[i] = sData[i]; oData[i+1] = sData[i+1]; oData[i+2] = sData[i+2]; oData[i+3] = sData[i+3];
                        }
                    }
                    ctx.putImageData(output, 0, 0);
                }

                if (isExport) {
                    return canvas.toDataURL('image/jpeg', 0.95);
                }
            },
            
            applyEdit() {
                if (this.activeCellIndex === null) return;
                const finalEditedBase64 = this.renderEditPreview(true);
                
                const newState = this.stateMgr.current;
                newState.images[this.activeCellIndex].editedBase64 = finalEditedBase64;
                newState.images[this.activeCellIndex].brightness = document.getElementById('sldBrightness').value;
                newState.images[this.activeCellIndex].sharpen = document.getElementById('sldSharpen').value;
                
                this.stateMgr.push(newState);
                this.closeEditModal();
                this.toast.show("Enhancements applied!");
            },
            closeEditModal() {
                document.getElementById('editModalOverlay').classList.remove('open');
                this.editImageObj = null;
            },

            // --- BATCH AUTO-FILL ---
            async handleBulkFile(e) {
                const files = Array.from(e.target.files); if (files.length === 0) return;
                const newState = this.stateMgr.current;
                let added = 0;

                for (let file of files) {
                    const emptyIdx = newState.images.findIndex(img => img.croppedBase64 === null);
                    if (emptyIdx === -1) break;
                    
                    try {
                        const { original, cropped } = await this.autoCenterCropSquare(file);
                        newState.images[emptyIdx] = { 
                            originalBase64: original, 
                            croppedBase64: cropped, 
                            editedBase64: null, 
                            brightness: 100, 
                            sharpen: 0,
                            radius: newState.settings.globalRadius,
                            cropData: null // Bulk upload defaults center, no custom crop data yet
                        };
                        added++;
                    } catch (err) {}
                }

                if (added > 0) { 
                    this.stateMgr.push(newState); 
                    this.toast.show(`Imported ${added} photos.`); 
                }
                e.target.value = '';
            },

            autoCenterCropSquare(file) {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const original = e.target.result;
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            canvas.width = 800; canvas.height = 800;
                            const ctx = canvas.getContext('2d');
                            const size = Math.min(img.width, img.height);
                            ctx.drawImage(img, (img.width - size)/2, (img.height - size)/2, size, size, 0, 0, 800, 800);
                            resolve({ original: original, cropped: canvas.toDataURL('image/jpeg', 0.92) });
                        };
                        img.src = original;
                    };
                    reader.readAsDataURL(file);
                });
            },

            // --- STATE PERSISTENCE & PDF EXPORT ---
            handleUndo() { if (this.stateMgr.undo()) this.closeMenu(); },
            handleRedo() { if (this.stateMgr.redo()) this.closeMenu(); },
            
            saveSettingsToLocal() { 
                const currentSettings = this.stateMgr.current.settings;
                localStorage.setItem('CollageStudio_Settings_Save', JSON.stringify(currentSettings)); 
                this.toast.show("Layout settings saved."); 
            },
            loadSettingsFromLocal() {
                const savedSettingsString = localStorage.getItem('CollageStudio_Settings_Save');
                if (savedSettingsString) {
                    try {
                        const savedSettings = JSON.parse(savedSettingsString);
                        const newState = this.stateMgr.current; 
                        newState.settings = { ...newState.settings, ...savedSettings };
                        
                        const newGlobalRadius = newState.settings.globalRadius;
                        newState.images.forEach(img => { if (img.croppedBase64) img.radius = newGlobalRadius; });

                        this.stateMgr.push(newState);
                        this.toast.show("Layout settings loaded!");
                    } catch (error) {
                        this.toast.show("Failed to load settings.", "error");
                    }
                } else {
                    this.toast.show("No saved settings found.", "error");
                }
            },

            async generatePDF() {
                const state = this.stateMgr.current;
                if (state.images.filter(i => i.croppedBase64 !== null).length === 0) {
                    return this.toast.show("Please add images before exporting.", "error");
                }

                const btn = document.getElementById('btnExportPDF');
                btn.innerText = `Processing...`; btn.disabled = true;

                try {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                    const s = state.settings;

                    for (let i = 0; i < 12; i++) {
                        const data = state.images[i];
                        const imgSource = data.editedBase64 || data.croppedBase64;
                        if (imgSource) {
                            const col = i % 3; const row = Math.floor(i / 3);
                            const x = s.marginLeft + (col * (s.size + s.gap));
                            const y = s.marginTop + (row * (s.size + s.gap));

                            const finalPngData = await this.applyCanvasRoundedCorners(imgSource, data.radius);
                            pdf.addImage(finalPngData, 'PNG', x, y, s.size, s.size);
                        }
                    }
                    pdf.save('CollageStudio_Layout.pdf');
                    this.toast.show("PDF Generated Successfully!");
                } catch (error) { 
                    this.toast.show("Error generating PDF.", "error"); 
                } finally { 
                    btn.innerText = `Generate PDF`; btn.disabled = false; 
                }
            },

            applyCanvasRoundedCorners(base64Image, radiusPx) {
                return new Promise((resolve) => {
                    if (radiusPx <= 0) return resolve(base64Image); 
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width; canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        
                        const scaleFactor = canvas.width / 226; 
                        const r = Math.min(radiusPx * scaleFactor, canvas.width / 2);

                        ctx.beginPath();
                        ctx.moveTo(r, 0); ctx.lineTo(canvas.width - r, 0);
                        ctx.quadraticCurveTo(canvas.width, 0, canvas.width, r);
                        ctx.lineTo(canvas.width, canvas.height - r);
                        ctx.quadraticCurveTo(canvas.width, canvas.height, canvas.width - r, canvas.height);
                        ctx.lineTo(r, canvas.height);
                        ctx.quadraticCurveTo(0, canvas.height, 0, canvas.height - r);
                        ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
                        ctx.closePath();
                        ctx.clip(); 
                        ctx.drawImage(img, 0, 0);
                        resolve(canvas.toDataURL('image/png'));
                    };
                    img.src = base64Image;
                });
            }
        };

        document.addEventListener('DOMContentLoaded', () => App.init());
    </script>
